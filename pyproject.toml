[project]
name = "calpit"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
    { name = "Biprateep Dey", email = "biprateep@pitt.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.6", # scipy.integrate.trapezoid
]

[project.urls]
"Source Code" = "https://github.com/lee-group-cmu/Cal-PIT"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
torch = [
    "lightning>=2.0", # Trains PyTorch models in calpit.CalPIT
    "spline-basis", # Used by calpit.nn.IsplineNN, the default model
    "torch",
]
sklearn = [
    "scikit-learn>=1.4", # Trains scikit-learn classifiers in calpit.CalPIT
]
qp = [
    "qp-prob", # Imports and exports qp ensembles in calpit.qp
]
hdf5 = [
    "h5py", # Used by calpit.nn.PhotometryDataset
]
plot = [
    "matplotlib", # Used by calpit.utils.plot_pit
]
all = [
    "calpit[torch,sklearn,qp,hdf5,plot]",
]
dev = [
    "calpit[all]",
    "jupyter", # Clears output from Jupyter notebooks
    "mypy", # Used for static type checking of files
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for linting and formatting
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/calpit/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]

ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]

[tool.ruff.lint.per-file-ignores]
# Vendored from https://github.com/AWehenkel/UMNN; keep close to upstream.
"src/calpit/nn/umnn/*" = ["B", "D", "N", "UP"]
# Test names say what they test.
"tests/*" = ["D103"]
[tool.setuptools.package-data]
calpit = ["py.typed", "nn/umnn/LICENSE"]

[tool.coverage.run]
omit=["src/calpit/_version.py"]
